[project]
name = "nomanual"
version = "0.1.0"
description = "NoManual is a light-weight app for an easy understanding and use of electrodomestics and products heavy user guides."
readme = "README.md"
authors = [
    { name = "Pol Coma", email = "comabarbar.pol@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "celery[redis]>=5.6.3",
    "fastapi>=0.141.1",
    "langchain>=1.3.16",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=4.14.5",
    "langgraph>=1.2.11",
    "mcp>=2.2.0",
    "openai>=3.3.1",
    "pgvector>=0.5.0",
    "py3langid>=0.4.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.16.2",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
nomanual = "nomanual:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pdfplumber>=0.11.10",
    "pymupdf>=1.28.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
    "watchdog>=6.0.0",
]

[tool.uv.build-backend]
module-root = "backend"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are evaluated per request, not once at import,
# so B008 does not apply to them.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.Header",
]

[tool.ruff.lint.per-file-ignores]
# Migrations are generated from Alembic's template and then frozen. Their style
# is not ours to fix, and rewriting an applied migration is worse than a lint
# warning.
"backend/alembic/versions/*" = ["E501", "I001", "UP007", "UP035"]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole run. The engine and its connection pool are
# created at import time, and a connection opened in one loop cannot be reused
# from another - which is exactly what a loop per test would do.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
