[project]
name = "nomanual"
version = "0.1.0"
description = "NoManual is a light-weight app for an easy understanding and use of electrodomestics and products heavy user guides."
readme = "README.md"
authors = [
    { name = "Pol Coma", email = "comabarbar.pol@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "celery[redis]>=5.6.3",
    "fastapi>=0.141.1",
    "langchain>=1.3.16",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=4.14.5",
    "langgraph>=1.2.11",
    "openai>=3.3.1",
    "pgvector>=0.5.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
nomanual = "nomanual:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]
