server {
    listen 80;
    # Also on IPv6: `localhost` resolves to ::1 first in many clients.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed filenames, so a bundle can be cached forever: a new build produces
    # a new name rather than a stale hit.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: the router lives in the browser, so any unknown path has
    # to return index.html instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
